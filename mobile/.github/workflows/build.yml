name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy to valid project dir name
        run: |
          rm -rf /tmp/qris_tester
          cp -r "$GITHUB_WORKSPACE" /tmp/qris_tester

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true

      - name: Pub get
        working-directory: /tmp/qris_tester
        run: flutter pub get

      - name: Scaffold Android platform
        working-directory: /tmp/qris_tester
        run: flutter create --org com.raoltech --platform android .

      - name: Analyze (non-fatal)
        working-directory: /tmp/qris_tester
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        working-directory: /tmp/qris_tester
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qris-tester-apk
          path: /tmp/qris_tester/build/app/outputs/flutter-apk/app-release.apk
