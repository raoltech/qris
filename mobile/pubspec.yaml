name: qris_tester
description: Android app to test @raoltech/qris (QRIS modular) features with a real Dana QRIS, build APK via GitHub Actions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  qr_flutter: ^4.1.0
  image: ^4.1.3
  package_info_plus: ^8.0.2
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
